[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -D CORE_DEBUG_LEVEL=1
test_framework = unity

[env:native]
platform = native
test_build_src = yes
build_src_filter = +<safety_state_machine.cpp>
test_framework = unity
build_flags =
  -std=c++17
  -I include
